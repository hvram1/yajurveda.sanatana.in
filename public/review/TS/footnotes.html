<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Footnote Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+Devanagari:wght@400;600&display=swap">
<style>
@font-face{font-family:"AdiShilaVedic";src:url("fonts/AdishilaVedic.ttf") format("truetype");font-weight:normal;font-style:normal}
/* Layout: a working desk. Queue down the left, the item in the middle, the printed page on the right; stacked on a phone. */
:root{
  --paper:#f6f7f5; --sheet:#ffffff; --ink:#1b2027; --mute:#5d6672; --rule:#d9dde0; --wash:#eceff0;
  --accent:#2f4a8a; --accent-ink:#ffffff;
  --ok:#24704a; --ok-wash:#e2f1e8; --warn:#9a5b00; --warn-wash:#f8ecd6; --bad:#a3302a; --bad-wash:#f7e1df;
  --mark-scan:#2f4a8a; --mark-prat:#24704a; --hl:#fff1b8;
  --ui:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --deva:"AdiShilaVedic","Noto Serif Devanagari",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14171b; --sheet:#1c2026; --ink:#e6e9ec; --mute:#9aa3ad; --rule:#323840; --wash:#252a31;
  --accent:#8fa8e8; --accent-ink:#10141b;
  --ok:#6cc596; --ok-wash:#1d3328; --warn:#e3a94f; --warn-wash:#3a2c16; --bad:#ef8a83; --bad-wash:#3d2220;
  --mark-scan:#8fa8e8; --mark-prat:#6cc596; --hl:#4a4220; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14171b; --sheet:#1c2026; --ink:#e6e9ec; --mute:#9aa3ad; --rule:#323840; --wash:#252a31;
  --accent:#8fa8e8; --accent-ink:#10141b;
  --ok:#6cc596; --ok-wash:#1d3328; --warn:#e3a94f; --warn-wash:#3a2c16; --bad:#ef8a83; --bad-wash:#3d2220;
  --mark-scan:#8fa8e8; --mark-prat:#6cc596; --hl:#4a4220; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--ui);margin:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);padding-block:12px}
.top-row{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between}
h1{font-size:18px;font-weight:600;margin:0;text-wrap:balance}
.sub{color:var(--mute);font-size:13px;max-width:70ch}
.progress{font:500 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--mute)}
.controls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:8px;font-size:13px}
select,button,input[type=text],textarea{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:6px}
select{padding:4px 6px}
button{padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,.w:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.store{font-size:12px;color:var(--mute)}
.store b{color:var(--ink);font-weight:500}
.toplinks{font-size:13px;color:var(--mute)}
.toplinks a{color:var(--accent)}
.toplinks b{color:var(--ink);font-weight:600}
.desk{display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1fr);gap:20px;padding-block:16px}
@media (max-width:1100px){.desk{grid-template-columns:180px minmax(0,1fr)} .scan{grid-column:1/-1}}
@media (max-width:700px){.desk{grid-template-columns:minmax(0,1fr)} .queue{max-height:200px;position:static} header.top{position:static} .sub{font-size:12px}}
.queue{overflow:auto;max-height:calc(100vh - 150px);position:sticky;top:120px;align-self:start;font-size:13px}
@media (max-width:700px){.queue{max-height:200px;position:static}}   /* after the rule above, or it loses */
.queue h3{font:600 11px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:12px 0 4px}
.queue h3:first-child{margin-top:0}
.qlist{display:flex;flex-wrap:wrap;gap:4px}
.qi{font:500 12px var(--mono);font-variant-numeric:tabular-nums;min-width:34px;padding:3px 6px;border-radius:5px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);position:relative}
.qi.cur{outline:2px solid var(--accent);outline-offset:1px}
.qi.done{background:var(--wash);color:var(--mute)}
.qi.done::after{content:"✓";position:absolute;top:-6px;right:-4px;font-size:10px;color:var(--ok)}
.qi .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:middle}
.g-ok{background:var(--ok)} .g-warn{background:var(--warn)} .g-bad{background:var(--bad)}
.item{min-width:0;display:flex;flex-direction:column;gap:14px}
.ihead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.ihead h2{font-size:20px;font-weight:600;margin:0;font-variant-numeric:tabular-nums}
.pill{font:600 11px var(--ui);letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.p-ok{background:var(--ok-wash);color:var(--ok)} .p-warn{background:var(--warn-wash);color:var(--warn)} .p-bad{background:var(--bad-wash);color:var(--bad)}
.p-plain{background:var(--wash);color:var(--mute)}
.why{margin:0;max-width:65ch}
.why li{margin-block:2px}
.evidence{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 12px;font-size:14px}
.evidence dt{color:var(--mute)}
.evidence dd{margin:0;min-width:0}
.deva{font-family:var(--deva)}
.label{font:600 11px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 6px}
.texts{display:grid;gap:8px}
.text{font-family:var(--deva);font-size:20px;line-height:2.2;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:10px 14px;max-height:340px;overflow:auto;position:relative}
.texts .text+.text{max-height:220px}
.text .pid{display:block;font:12px var(--mono);color:var(--mute);line-height:1.6}
.w{border-radius:4px;padding:0 1px}
.picking .w{cursor:pointer}
.picking .w:hover{background:var(--hl)}
.w.chosen{background:var(--hl);box-shadow:0 0 0 2px var(--accent)}
sup.mk{font:600 12px var(--ui);padding:0 3px;border-radius:3px;margin:0 1px}
sup.ms{background:var(--mark-scan);color:var(--sheet)}
sup.mp{border:1.5px solid var(--mark-prat);color:var(--mark-prat)}
sup.mx{background:var(--accent);color:var(--accent-ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute);margin-top:6px}
.bhashya{font-family:var(--deva);font-size:16px;line-height:1.9;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:10px 14px;max-height:220px;overflow:auto}
.actions{display:flex;flex-wrap:wrap;gap:8px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.actions button.on{box-shadow:0 0 0 2px var(--accent)}
.hint{font-size:13px;color:var(--mute)}
textarea{width:100%;min-height:56px;padding:6px 8px}
input[type=text]{width:100%;padding:6px 8px;font-family:var(--deva);font-size:16px}
.decided{font-size:13px;padding:8px 12px;border-radius:6px;background:var(--ok-wash);color:var(--ok)}
.scan{min-width:0;position:sticky;top:120px;align-self:start}
@media (max-width:1100px){.scan{position:static}}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;align-items:center}
.tabs button{padding:2px 8px;font:500 12px var(--mono)}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.frame{overflow:auto;max-height:calc(100vh - 170px);border:1px solid var(--rule);border-radius:8px;background:#fff}
.frame img{display:block;width:100%;max-width:100%}
.frame.zoom img{width:200%;max-width:none}
.empty{color:var(--mute);padding:24px 0}
kbd{font:11px var(--mono);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:4px;opacity:.7;background:transparent;color:inherit}
@media (prefers-reduced-motion:no-preference){.qi,button{transition:border-color .15s,background .15s}}
</style>
<style>
/* Footnotes, a printed page at a time: the band as printed above the list read from it, the whole page on the right. */
.bandbox{background:#fff;border:1px solid var(--rule);border-radius:8px;overflow:auto;max-height:46vh}
.bandbox img{display:block;width:100%}
.bandbox.zoom img{width:180%;max-width:none}
.fns{display:grid;gap:10px}
.fn{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:10px 14px;display:grid;gap:8px}
.fn.done{border-color:var(--ok)}
.fn.deferred{background:transparent;color:var(--mute);padding:6px 14px;gap:0;font-size:13px}
.fn.deferred .deva{font-size:16px;color:var(--ink)}
.fn .row1{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.fn .mk{font:600 20px var(--deva);min-width:1.6em}
.fn .note{font-family:var(--deva);font-size:19px;line-height:1.6}
.fn .ctx{font-family:var(--deva);font-size:17px;line-height:1.9;color:var(--mute)}
.fn .ctx mark{background:var(--hl);color:var(--ink);font-weight:600;padding:0 3px;border-radius:3px}
.fn .ctx b{color:var(--ink);font-weight:400}
.fn .lbl{font:600 11px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-right:6px}
.fn .actions button{padding:4px 10px;font-size:13px}
.fn .chk{font-size:13px;display:flex;gap:6px;align-items:center}
.fn input[type=text]{font-size:16px}
.fn .decided{padding:4px 10px}
/* the band stays in view while the cards below it scroll */
@media (min-width:1101px){.bandwrap{position:sticky;top:118px;z-index:2;background:var(--paper);padding-bottom:6px}.bandwrap .bandbox{max-height:30vh}}
.pagebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
</style>

<header class="top wrap">
  <div class="top-row">
    <h1 id="title">Footnote review</h1>
    <span class="progress" id="progress">loading…</span>
  </div>
  <div class="sub" id="sub"></div>
  <div class="controls">
    <label><input type="checkbox" id="undecided" checked> only pages with undecided footnotes</label>
    <span class="store" id="store">Decisions are saved in this browser.</span>
    <button id="download" hidden>Download decisions</button>
    <span class="toplinks" id="nav"></span>
  </div>
</header>

<main class="desk wrap">
  <nav class="queue" id="queue" aria-label="Pages to review"></nav>
  <section class="item" id="item"><p class="empty">Loading the footnotes…</p></section>
  <aside class="scan" id="scan" aria-label="Printed page"></aside>
</main>

<script>
(function(){
const KIND={variant:["Variant reading","warn"],other:["Note","warn"],source:["Source reference","plain"]};
const WHERE={bhashya:"bhāṣya",mantra:"saṃhitā",padapatha:"padapāṭha"};
const $=id=>document.getElementById(id);
// one prapāṭhaka at a time on the site (?part=01.01 loads parts/01.01/); the whole file when run without one
const PART=new URLSearchParams(location.search).get("part")||"";
const SRC=n=>PART?`parts/${PART}/${n}`:n;
const partLabel=()=>PART?` · ${PART.split(".").map(Number).join(".")}`:"";
function nav(here){const q=PART?"?part="+PART:"";
  $("nav").innerHTML=[["index.html","All prapāṭhakas"],["numbers.html","Reference numbers"],["footnotes.html","Footnotes"],["openings.html","Openings against the docx"]]
    .map(([h,t])=>h===here?`<b>${t}</b>`:`<a href="${h}${h==="index.html"?"":q}">${t}</a>`).join(" · ")}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const docId=id=>id.replace(/\//g,".").replace(/#/g,"~").replace(/\*/g,"@");
let F=null, groups=[], cur=null, decisions={}, store="local", db=null, uid=null, text="";
const LKEY=()=>"review-decisions:"+text;   // the numbers page's store: one download carries both

function label(k){
  let m=/^(\d\d)\/(\d\d)\/(\d\d)$/.exec(k); if(m) return `TS ${+m[1]}.${+m[2]}.${+m[3]}`;
  m=/^P(\d+)\.Pr(\d+)\.A(\d+)$/.exec(k); if(m) return `TB ${m[1]}.${m[2]}.${m[3]}`;
  return k;
}
function pageLabel(pid){const m=F.pages[pid]; return m&&m.printed?`p. ${m.printed}`:pid}
function loadLocal(){try{return JSON.parse(localStorage.getItem(LKEY())||"{}")}catch(e){return {}}}
// re-read before writing: the numbers page may be open in another tab on the same store
function saveLocal(id,body){try{const all=loadLocal(); if(body) all[id]=body; else delete all[id]; localStorage.setItem(LKEY(),JSON.stringify(all))}catch(e){}}

const asked=g=>g.footnotes.filter(f=>f.route==="vidwan");
const pageDone=g=>asked(g).every(f=>decisions[f.id]);
function visible(){const und=$("undecided").checked; return groups.filter(g=>!und||!pageDone(g)||g===cur)}
function progress(){
  const all=groups.flatMap(asked), done=all.filter(f=>decisions[f.id]).length;
  $("progress").textContent=`${done} of ${all.length} footnotes decided · ${groups.filter(pageDone).length} of ${groups.length} pages`;
  $("download").hidden=store!=="local"||!Object.keys(decisions).length;
}
function renderQueue(){
  const by={}; visible().forEach(g=>(by[g.anuvaka]=by[g.anuvaka]||[]).push(g));
  $("queue").innerHTML=Object.keys(by).map(k=>`<h3>${esc(label(k))}</h3><div class="qlist">`+by[k].map(g=>{
    const n=asked(g).length, left=asked(g).filter(f=>!decisions[f.id]).length;
    return `<button class="qi${g===cur?" cur":""}${left?"":" done"}" data-p="${esc(g.page)}" title="${n} footnote${n>1?"s":""} to check">${esc(pageLabel(g.page))}<span style="opacity:.6"> ·${n}</span></button>`}).join("")+`</div>`).join("")
    ||`<p class="empty">Every page is decided.</p>`;
  $("queue").querySelectorAll(".qi").forEach(b=>b.onclick=()=>open(groups.find(g=>g.page===b.dataset.p)));
  progress();
}

function context(f){
  const where=WHERE[f.where]||f.where||"text";
  if(f.place==="placed") return `<div class="ctx"><span class="lbl">Mark in the ${esc(where)}</span>${esc(f.context[0])}<mark>${esc(f.mark)}</mark>${esc(f.context[1])}</div>`;
  const why=f.place==="ambiguous"?"these words occur more than once in the digital text":"not found in the digital text";
  return `<div class="ctx"><span class="lbl">Mark in the ${esc(where)}</span>read between <b>${esc(f.before)}</b> <mark>${esc(f.mark)}</mark> <b>${esc(f.after)}</b> · ${why}; find it on the page</div>`;
}
function verdictText(d){return ({correct:"reads correctly",misread:`reads ${d.reading||""}`,not_footnote:"not a footnote"})[d.verdict]||d.verdict}
function card(f){
  if(f.route!=="vidwan") return `<div class="fn deferred"><span class="deva">${esc(f.mark)}${esc(f.note)}</span> · a source reference, checked later against the digital text's references; nothing to do here</div>`;
  const d=decisions[f.id], k=KIND[f.kind]||[f.kind,"plain"];
  return `<div class="fn${d?" done":""}" data-id="${esc(f.id)}">
    <div class="row1"><span class="mk">${esc(f.mark)}</span><span class="pill p-${k[1]}">${esc(k[0])}</span>${f.unsure?`<span class="pill p-bad">read unsure</span>`:""}</div>
    <div class="note"><span class="lbl">Read as</span>${esc(f.mark)}${esc(f.note)}</div>
    ${context(f)}
    ${d?`<div class="decided">Decided: ${esc(verdictText(d))}${d.mark==="elsewhere"?" · mark not at this place":""}${d.note?" · "+esc(d.note):""} <button data-a="undo">Change</button></div>`:
    `<div class="actions"><button class="primary" data-a="correct">Reads correctly</button><button data-a="misread">Correct the reading</button><button data-a="not_footnote">Not a footnote</button></div>
    <label class="chk"><input type="checkbox" data-a="elsewhere"> The mark is not at the place shown</label>
    <div data-fix hidden><input type="text" value="${esc(f.note)}" aria-label="The footnote as printed"><div class="actions" style="margin-top:6px"><button class="primary" data-a="savefix">Save reading</button></div></div>
    <input type="text" data-note placeholder="Note (optional)" aria-label="Note" style="font-family:var(--ui);font-size:14px">`}
  </div>`;
}

function open(g){
  if(!g){$("item").innerHTML=`<p class="empty">Nothing left with this filter.</p>`;$("scan").innerHTML="";renderQueue();return}
  cur=g; try{localStorage.setItem(LKEY()+":fn",g.page)}catch(e){}
  const m=F.pages[g.page], n=asked(g).length, left=asked(g).filter(f=>!decisions[f.id]).length;
  const missed=decisions[g.page+"*missed"];
  $("item").innerHTML=`<div class="ihead"><h2>${esc(label(g.anuvaka))} · ${esc(pageLabel(g.page))}</h2><span class="pill p-${left?"warn":"ok"}">${left?`${left} of ${n} to check`:"done"}</span></div>
    <p class="why">Compare each footnote below with the band as printed, then find its mark in the page. Highlighted: where the mark falls in the digital text.</p>
    <div class="bandwrap"><div class="pagebar"><p class="label" style="margin:0">Footnotes as printed${m.band_grade==="bottom"?" · no rule found, the foot of the page is shown":""}</p><button id="bzoom" style="padding:2px 8px;font-size:12px">Zoom</button></div>
      <div class="bandbox" id="band" style="margin-top:6px"><img src="${esc(m.band)}" alt="Footnotes printed at the foot of ${esc(pageLabel(g.page))}"></div></div>
    <div class="fns">${g.footnotes.map(card).join("")}</div>
    ${left?`<div class="actions"><button class="primary" id="allok">All remaining read correctly</button></div>`:""}
    <div><p class="label">A footnote on this page that is missing from the list</p><textarea id="missed" placeholder="Its mark and text, as printed">${esc(missed&&missed.note||"")}</textarea>
      <div class="actions" style="margin-top:6px"><button id="savemissed">${missed?"Update":"Save"}</button></div></div>`;
  $("scan").innerHTML=`<div class="tabs"><button class="on">${esc(pageLabel(g.page))}</button><button id="zoom">Zoom</button></div>
    <div class="frame" id="frame"><img src="${esc(m.file)}" alt="Printed page ${esc(pageLabel(g.page))}"></div>`;
  $("zoom").onclick=()=>$("frame").classList.toggle("zoom");
  $("bzoom").onclick=()=>$("band").classList.toggle("zoom");
  wire(g); renderQueue();
}
function wire(g){
  $("item").querySelectorAll(".fn[data-id]").forEach(el=>{
    const f=g.footnotes.find(x=>x.id===el.dataset.id), q=s=>el.querySelector(s);
    const base=()=>({mark:q('[data-a="elsewhere"]')&&q('[data-a="elsewhere"]').checked?"elsewhere":undefined,note:(q("[data-note]")||{}).value||undefined});
    el.querySelectorAll("button[data-a]").forEach(b=>b.onclick=()=>{
      const a=b.dataset.a;
      if(a==="undo") return undecide(f.id);
      if(a==="misread"){q("[data-fix]").hidden=false;q("[data-fix] input").focus();return}
      if(a==="savefix") return decide(f.id,{verdict:"misread",reading:q("[data-fix] input").value,...base()});
      decide(f.id,{verdict:a,...base()});
    });
  });
  const ok=$("allok"); if(ok) ok.onclick=async()=>{for(const f of asked(g)) if(!decisions[f.id]) await decide(f.id,{verdict:"correct"},true); after(g)};
  $("savemissed").onclick=()=>{const t=$("missed").value.trim(); t?decide(g.page+"*missed",{verdict:"missed",note:t},true).then(()=>open(g)):undecide(g.page+"*missed")};
}
function after(g){
  if(!pageDone(g)){open(g);return}
  const v=visible(), i=v.indexOf(g);
  open(v.slice(i+1).find(x=>!pageDone(x))||v.find(x=>!pageDone(x)&&x!==g)||g);
}
async function decide(id,body,quiet){
  body.item=id; body.at=new Date().toISOString(); if(uid) body.by=uid;
  Object.keys(body).forEach(k=>body[k]===undefined&&delete body[k]);
  decisions[id]=body;
  if(store==="db"){
    try{await db.collection("decisions").doc(docId(id)).set(body)}
    catch(e){status(`This decision was not saved (${e&&e.code||"error"}). It is kept in this browser.`);store="local"}
  }
  if(store==="local") saveLocal(id,body);
  if(!quiet) after(cur);
}
async function undecide(id){
  delete decisions[id];
  if(store==="db"){try{await db.collection("decisions").doc(docId(id)).delete()}catch(e){}}
  else saveLocal(id,null);
  open(cur);
}
function status(t){$("store").textContent=t}

document.addEventListener("keydown",e=>{
  if(!cur||/^(TEXTAREA|INPUT|SELECT)$/.test(e.target.tagName)) return;
  const v=visible(), i=v.indexOf(cur);
  if((e.key==="j"||e.key==="ArrowDown")&&v[i+1]){e.preventDefault();open(v[i+1])}
  else if((e.key==="k"||e.key==="ArrowUp")&&i>0){e.preventDefault();open(v[i-1])}
});

$("download").onclick=()=>{
  const all=loadLocal();
  const blob=new Blob([JSON.stringify({text,saved:new Date().toISOString(),decisions:Object.values(all)},null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`decisions_${text}_${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click(); a.remove();
};

async function connect(){
  const use=window.claude&&window.claude.use;
  if(!use) return;
  const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]).catch(()=>[null,null]);
  if(!d) return;
  db=d; uid=u?await u.id():null;
  if(u&&u.can){const w=await u.can("data.write"); if(w===false){status("You can read this review but not record decisions. Ask the owner for Contributor access.");return}}
  store="db"; status("Decisions are saved to this page and shared with the project.");
  db.collection("decisions").onSnapshot(snap=>{
    const next={}; snap.docs.forEach(doc=>{const b=doc.data(); if(b&&b.item) next[b.item]=b});
    decisions=next; if(cur) open(cur); else renderQueue();
  },e=>{store="local";decisions=loadLocal();status(`The shared store stopped answering (${e.code}). Decisions are kept in this browser.`);renderQueue()});
}

fetch(SRC("footnotes.json")).then(r=>r.json()).then(f=>{
  F=f; groups=f.groups; text=f.summary.text; decisions=loadLocal();
  const s=f.summary, r=s.route||{};
  $("title").textContent=`${text==="TS"?"Taittirīya Saṃhitā":text.replace(/_/g," ")}${partLabel()} · Bhaṭṭabhāskara footnote review`; nav("footnotes.html");
  $("sub").textContent=`${s.read} footnotes were read from the printed pages. ${r.deferred||0} are source references, to be checked against the digital text's own references first, and are not asked here. The other ${r.vidwan||0}, on ${s.pages} pages, are below: one page at a time, the footnotes as printed above the list read from them.`;
  $("undecided").onchange=()=>{const v=visible();open(v.includes(cur)?cur:v[0])};
  let start=null; try{const p=localStorage.getItem(LKEY()+":fn");start=groups.find(g=>g.page===p)}catch(e){}
  open(start||visible()[0]);
  connect();
}).catch(e=>{$("item").innerHTML=`<p class="empty">The footnotes could not be loaded (${esc(e.message)}).</p>`});
})();
</script>
